name: Atualizar notícias

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC = 06:00 em Fortaleza, todo dia
  workflow_dispatch:        # também permite rodar na mão, pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Buscar notícias
        run: python buscar_noticias.py

      - name: Publicar se mudou algo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/noticias.js
          git diff --staged --quiet || git commit -m "Atualiza notícias (automático)"
          git push
